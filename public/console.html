<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华数字标牌运营中心</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">知华数字标牌<small>ZHUATECH SIGNAGE</small></div><div class="nav"><div class="active">运营总览</div><div>内容素材</div><div>播放策略</div><div>终端设备</div><div>播出证明</div><div>告警与审计</div></div></aside><main class="main">
<div class="top"><div><h1>运营总览</h1><div class="muted">终端在线状态、内容发布与播放履约</div></div><span class="status"><i class="dot"></i>平台运行正常</span></div>
<section class="metrics" id="metrics"></section><div class="grid"><section class="card"><div class="section-title"><h2>终端状态</h2><button class="button">注册终端</button></div><div id="screens"></div></section><section class="card"><div class="section-title"><h2>当前发布</h2><span class="muted">自动刷新</span></div><div id="campaigns"></div></section></div>
</main></div><script>
const key='zhuatech-demo-key';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/dashboard',{headers:{'x-api-key':key}}).then(r=>r.json()).then(d=>{const labels={screens:'终端总数',online:'在线终端',campaigns:'发布任务',assets:'内容素材',playsToday:'今日播放'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${v}</strong></div>`).join('');screens.innerHTML=d.screens.map(x=>`<div class="screen-row"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.code)}</div></div><span>${esc(x.site)}</span><span>${esc(x.playerVersion||'待激活')}</span><span class="pill">${esc(x.status)}</span></div>`).join('');campaigns.innerHTML=d.campaigns.map(x=>`<div class="campaign"><strong>${esc(x.name)}</strong><span class="muted">优先级 ${x.priority} · ${x.status}</span><div class="bar"><i></i></div></div>`).join('')}).catch(()=>{metrics.innerHTML='<div class="card">服务连接失败</div>'});
</script></body></html>
